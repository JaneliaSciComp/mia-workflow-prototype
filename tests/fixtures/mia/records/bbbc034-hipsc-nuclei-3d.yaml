short_name: hiPSC colony 3D nuclei segmentation (fluorescence)
description: Allen Institute for Cell Science 3D images of a clustered monolayer of human induced pluripotent
  stem cells (4 channels - CellMask plasma membrane, GFP-edited, DNA, brightfield; 1024x1024x52). One
  volume comes with a manually annotated 3D nucleus segmentation (ground_truth_segmented.tif). Colony
  edge and centre stacks (membrane, EGFP beta-actin, Hoechst) are included without ground truth.

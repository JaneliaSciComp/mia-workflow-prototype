notes: 'Read: the Janelia hemibrain page (CC BY 4.0; v1.0 to v1.2; neuPrint, DVID, connection-matrix CSVs), the
  public Neuroglancer layer file (8 nm voxels; EM, segmentation v1.2, mito-objects, synapses, ROIs as precomputed
  volumes) and the eLife paper (26 teravoxels of 8-bit data, 13 slabs, FFN segmentation, 122 dense synapse-annotated
  cubes, data via neuprint.janelia.org, DOI 10.25378/janelia.11676099.v2). size_bytes is 26 teravoxels at 8 bits,
  not a measured bucket size. The data are served through Neuroglancer precomputed volumes, neuPrint and DVID rather
  than one archive, so no single download URL. The record covers the central-brain volume, separate from the MANC
  and whole-CNS records.'

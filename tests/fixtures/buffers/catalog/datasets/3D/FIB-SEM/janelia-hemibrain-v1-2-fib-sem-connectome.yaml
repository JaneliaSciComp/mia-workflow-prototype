title: 'Hemibrain: FIB-SEM connectome of the adult Drosophila central brain (v1.2)'
short_name: Drosophila hemibrain connectome (FIB-SEM)
description: 8 nm isotropic FIB-SEM volume (26 teravoxels, 8-bit) of roughly half of the central brain of an adult
  female Drosophila melanogaster, 13 consecutive 20 um hot-knife slabs imaged on two customised FIB-SEM systems,
  with flood-filling-network segmentation, extensive proofreading (about 25,000 neurons), automatic T-bar and postsynaptic
  density detections, mitochondria segmentation (v1.2) and brain-region masks. Released by HHMI Janelia FlyEM and
  Google (v1.0 Jan 2020, v1.2 Dec 2020).

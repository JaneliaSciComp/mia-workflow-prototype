notes: 'Four TIFFs in one Zenodo record (1.15 GB). Masks were made in Fiji ("obtained in FiJi"); the EdU mask name says threshold
  200, so they are likely thresholding / analyze-particles output, but the page does not say; source unknown. No paper found.
  Dedup: DeepFoci (zenodo-4067741) and zenodo-19222986 are other foci datasets, different cells and images. enricher: dimensionality
  3D -> 2D, n_items 1 -> 25 (inferred): the ImageJ header calls the 25 planes frames, not slices; adjacent planes are unrelated
  (raw DAPI r = 0.07, nuclei-mask IoU = 0.07); mask IDs are numbered per plane and never repeat across planes; EdU / γH2AX
  staining needs fixed cells, so not a time-lapse. So the stack holds 25 separate 2D fields. Voxel size 45.07 nm x/y from
  the TIFF headers (unit micron); z not applicable. Nuclei count-mask max is 321, not 255.'

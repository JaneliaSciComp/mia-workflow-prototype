notes: 'Voxel/pixel size not stated on the EMPIAR entry (pixel_width null), API record, or paper Methods (varies
  per source; benchmarks resampled to 10-25 nm), so left null. Modalities per paper: FIB-SEM, TEM, STEM (STEM mapped
  to TEM). Organisms listed from paper Methods. Archive cem_mitolab.zip listed with peek_archive: ~43.6K TIFFs (image+mask
  pairs, ~21.8K each) plus a metadata/cem_mitolab_metadata.xlsx. Annotations crowdsourced (Zooniverse, 10 annotators
  per image, consensus) then expert reviewed. No train/val/test split stated in the entry. enricher: size_bytes
  set to the exact file-listing total (was 2956700000).'

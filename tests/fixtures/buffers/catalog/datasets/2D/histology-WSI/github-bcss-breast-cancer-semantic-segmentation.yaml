schema_version: '1.2'
id: github-bcss-breast-cancer-semantic-segmentation
title: Breast Cancer Semantic Segmentation (BCSS) dataset
short_name: Breast cancer H&E tissue regions (BCSS)
description: Crowdsourced pixel-level tissue-region segmentation of 151 TCGA triple-negative breast cancer H&E regions of
  interest (tumor, stroma, lymphocytic infiltrate, necrosis and other classes), annotated by 25 participants with pathologist
  review.

[project]
name = "mia-workflow-prototype"
version = "0.1.0"
description = "MIA agentic workflows prototype: autodev (GitHub issue -> Claude Code PR), Temporal orchestration, LSF via csub"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml",
    "cryptography",
]

[project.scripts]
autodev = "autodev.cli:main"
mia-data = "mia_data.cli:main"
mia = "mia_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodev", "mia_data", "mia_ops"]
include = ["mia_data/prompts/*.md"]  # already in by default; named so it stays

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pyyaml = "*"
pydantic = ">=2"
httpx = "*"
cryptography = "*"

[tool.pixi.pypi-dependencies]
mia-workflow-prototype = { path = ".", editable = true }
temporalio = ">=1.7"
csub = { git = "https://github.com/krokicki/csub", branch = "deploy-all" }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"
respx = "*"
ruff = "*"
mypy = "*"
types-PyYAML = "*"
orjson = "*"  # mypy writes its cache with it; without the real package an empty site-packages dir shadows it

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/"
lint = "ruff check . && ruff format --check ."
fmt = "ruff format . && ruff check --fix ."
typecheck = "mypy autodev mia_data mia_ops"
mia = "mia"

[tool.ruff]
line-length = 120
extend-exclude = ["notes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF100"]
ignore = ["E501"]  # long lines are reviewed by eye; the renames pushed a few past 120

[tool.ruff.lint.per-file-ignores]
# fake activity dispatchers and fake services are one big switch each; that is the test, not a smell
"tests/*" = ["C901", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 6  # more than this wants a parameter object (JobArgs, Reviewers)
max-returns = 8  # decide() and _round() return once per outcome

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["csub", "csub.*"]
ignore_missing_imports = true

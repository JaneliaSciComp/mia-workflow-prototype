[project]
name = "mia-workflow-prototype"
version = "0.1.0"
description = "MIA agentic workflows prototype: autodev (GitHub issue -> Claude Code PR), Temporal orchestration, LSF via csub"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml",
    "cryptography",
]

[project.scripts]
autodev = "autodev.cli:main"
mia-data = "mia_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodev", "mia_data"]
include = ["mia_data/prompts/*.md"]  # already in by default; named so it stays

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pyyaml = "*"
pydantic = ">=2"
httpx = "*"
cryptography = "*"

[tool.pixi.pypi-dependencies]
mia-workflow-prototype = { path = ".", editable = true }
temporalio = ">=1.7"
csub = { git = "https://github.com/krokicki/csub", branch = "deploy-all" }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"
respx = "*"

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/"
ad = "autodev"
md = "mia-data"
